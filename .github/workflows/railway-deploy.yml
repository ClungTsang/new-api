name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          set -e
          curl -fsSL https://railway.app/install.sh | sh
          echo "installed railway"

      - name: Auth check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          railway whoami || echo "whoami failed"
          railway status || echo "status failed"

      - name: Create railway.toml
        run: |
          python3 -c "
import os
content = '[build]\nbuilder = "nixpacks"\n[deploy]\nport = 3000\nstartCommand = "./new-api"\n'
with open('railway.toml','w') as f: f.write(content)
print('ok')
"
          cat railway.toml

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          railway up --detach --json --project-id ${{ secrets.RAILWAY_PROJECT_ID }} --service new-api || echo "deploy failed"

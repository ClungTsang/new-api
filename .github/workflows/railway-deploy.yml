name: Deploy to Railway

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          set -e
          echo "Starting install"
          curl -fsSL https://railway.app/install.sh | sh
          railway --version

      - name: Deploy
        run: |
          export PATH="$HOME/.railway/bin:$PATH"
          railway status

name: Deploy to Railway

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway
        run: |
          curl -fsSL https://railway.app/install.sh > /tmp/install.sh
          bash /tmp/install.sh
          echo "INSTALLED"

      - name: Check railway
        run: |
          ls ~/.railway/bin/
          bash -c 'railway --version'

      - name: Auth
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
        run: |
          bash -c 'railway whoami'

      - name: Config
        run: |
          printf '%s\n' '[build]' 'builder = "nixpacks"' '' '[deploy]' 'startCommand = "./new-api"' 'port = 3000' > railway.toml
          cat railway.toml

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          bash -c 'railway up --detach --project-id $RAILWAY_PROJECT_ID --service new-api'
